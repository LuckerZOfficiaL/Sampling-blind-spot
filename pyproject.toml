[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampling-blind-spot"
version = "0.1.0"
description = "Diagnosing the sampling blind spot in math-reasoning difficulty estimation via activation grafting"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
keywords = ["llm", "transformers", "activation", "grafting", "interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "tokenizers>=0.15.0",
    "accelerate>=0.25.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]
all = [
    "sampling-blind-spot[dev,viz,notebook]",
    "huggingface_hub>=0.20.0",
    "wandb>=0.15.0",
]

[project.urls]
"Homepage" = "https://github.com/LuckerZOfficiaL/sampling-blind-spot"
"Bug Tracker" = "https://github.com/LuckerZOfficiaL/sampling-blind-spot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # defaults
  \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pylint.main]
load-plugins = []
jobs = 0
ignore-paths = [".venv", "build", "dist", ".*\\.egg-info"]

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods (dataclasses, ABCs)
    "R0913",  # too-many-arguments (ML functions legitimately have many params)
    "R0914",  # too-many-locals (long experiment functions)
    "R0917",  # too-many-positional-arguments (ML functions)
    "R0902",  # too-many-instance-attributes (config/engine classes)
    "E1102",  # not-callable (false positive on torch functions)
    "W0511",  # fixme/todo
    "E0401",  # import-error (optional deps like wandb, modal, bfcl_eval)
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-locals = 25

[tool.pylint.similarities]
min-similarity-lines = 6
